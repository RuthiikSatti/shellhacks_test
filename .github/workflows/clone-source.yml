name: Clone Shellhacks Project

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/clone-source.yml"

permissions:
  contents: write

jobs:
  clone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Clone source repo
        run: git clone --depth 1 https://github.com/5quidL0rd/Shellhacks_Project.git /tmp/source

      - name: Replace target contents with source contents
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude='.git' /tmp/source/ ./

      - name: Commit cloned project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clone 5quidL0rd/Shellhacks_Project for deployment testing" || exit 0
          git push origin HEAD:main
